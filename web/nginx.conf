# Sirve los archivos estaticos y reenvia /api/ hacia el contenedor "api".
# Asi el navegador solo conoce http://localhost:8080 y nunca las bases de datos.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;     # la barra final quita el prefijo /api
        proxy_set_header Host $host;
    }
}
